<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>:root{--red:#C8433A;--red-d:#9E2F28;--red-dd:#6E1F1A;--red-l:#F9E7E4;--ink:#141414;--muted:#6B6360;--line:#E9DEDA;--amber:#E3A71E;--amber-d:#A35900;--amber-l:#FCF1D6;--bg:#FDFAF8;--ok:#1f6b36;--ok-l:#E7F3EA;--pur:#54398a;--pur-l:#EEE9F6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#EDE7E4;font:15px/1.5 'Inter',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
h1,h2,h3,h4{font-family:'Manrope','Inter',system-ui,sans-serif;margin:0;line-height:1.2}
i[data-lucide],svg.lucide{width:1.2em;height:1.2em;flex:none}
button{font:inherit;cursor:pointer}
.app{width:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:560px){body{padding:20px}.app{width:400px;height:min(820px,calc(100dvh - 40px));border-radius:38px;border:11px solid #111;box-shadow:0 30px 70px rgba(20,20,20,.35)}}
.hd{background:var(--red);color:#fff;padding:16px 16px 14px;display:flex;align-items:center;gap:10px;flex:none}
.hd h3{color:#fff;font-size:1.05rem;flex:1}.hd small{display:block;opacity:.85;font-size:.74rem}
.hd button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.bd{flex:1;overflow:auto;padding:14px;display:grid;gap:12px;align-content:start}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#fff;flex:none;padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:none;padding:9px 2px 8px;font-size:.64rem;font-weight:700;color:var(--muted);display:grid;justify-items:center;gap:3px}.nav button.on{color:var(--red)}.nav i{width:1.5em;height:1.5em}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(20,20,20,.05)}
.card h4{font-size:.95rem;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--red);color:#fff;font-weight:700;padding:13px;border-radius:12px}.btn:active{background:var(--red-d)}
.btn.dark{background:var(--ink)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.sm{width:auto;padding:8px 12px;font-size:.8rem;border-radius:9px}
label{display:block;font-size:.76rem;font-weight:700;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red-l);border-color:var(--red)}
textarea{min-height:74px}
.st{font:700 .66rem 'Manrope',sans-serif;padding:4px 9px;border-radius:999px;white-space:nowrap}
.Pending,.Open,.Assigned,.Submitted{background:var(--amber-l);color:var(--amber-d)}.Approved,.Verified,.Returned,.Resolved,.Completed{background:var(--ok-l);color:var(--ok)}.Rejected{background:var(--red-l);color:var(--red-dd)}.Under{background:var(--pur-l);color:var(--pur)}
.hint{font-size:.78rem;color:var(--muted)}
.big{border-radius:16px;padding:18px;background:linear-gradient(135deg,var(--red-dd),var(--red));color:#fff}.big h2{color:#fff;font-size:1.5rem;margin:2px 0}.big p{margin:4px 0 0;font-size:.85rem;opacity:.92}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:6px;color:var(--ink)}.tile i{color:var(--red);width:1.6em;height:1.6em}.tile b{font-size:.88rem}.tile small{color:var(--muted);font-size:.72rem;line-height:1.3}
.tile.fut{border:2px dashed #D9C3BD;background:repeating-linear-gradient(135deg,#fff,#fff 8px,#FDF8F6 8px,#FDF8F6 16px)}.tile.fut i{color:var(--pur)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;text-align:left}.li b{display:block;font-size:.88rem}.li small{color:var(--muted);font-size:.74rem}
.fb{background:var(--pur-l);border:1px solid #D9CCEE;color:var(--pur);border-radius:12px;padding:10px 12px;font-size:.78rem;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.note{background:var(--amber-l);border:1px solid #F0D58F;color:#5b3a00;border-radius:12px;padding:10px 12px;font-size:.8rem}
.logo{width:150px;margin:0 auto;display:block;mix-blend-mode:multiply}
.banner{border-radius:14px;width:100%;display:block}
.auth{padding:18px;display:grid;gap:12px;align-content:start;flex:1;overflow:auto}
.sec-t{font:800 .72rem 'Manrope',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.badge{font:700 .62rem 'Manrope',sans-serif;padding:3px 8px;border-radius:999px;display:inline-block;margin-right:4px}
.b-q{background:var(--pur-l);color:var(--pur)}.b-g{background:#E3EEFB;color:#245a9a}
.prev{width:100%;max-height:170px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.toast{position:absolute;left:12px;right:12px;top:12px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;z-index:50;font-size:.85rem;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:dn .25s}
@keyframes dn{from{transform:translateY(-14px);opacity:0}}
.qr{width:200px;height:200px;margin:8px auto;display:block;image-rendering:pixelated;border:6px solid #fff;box-shadow:0 0 0 1px var(--line)}
.scan{height:200px;background:#2A2523;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;color:#a59a96;font-size:.8rem}
.scan::before{content:"";position:absolute;inset:30px;border:2px solid var(--amber);border-radius:10px}
.scan::after{content:"";position:absolute;left:30px;right:30px;height:3px;background:var(--red);top:30px;animation:sc 1.2s linear infinite}
@keyframes sc{to{top:166px}}
.map{height:220px;border-radius:14px;background:#E8EFE6;position:relative;overflow:hidden;border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 6px rgba(200,67,58,.25);transform:translate(-50%,-50%)}
canvas.sig{width:100%;height:150px;background:#fff;border:1px dashed var(--muted);border-radius:12px;touch-action:none}
.bars{display:flex;align-items:flex-end;gap:12px;height:120px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}.bars span{width:100%;background:var(--red-l);border-top:3px solid var(--red);border-radius:5px 5px 0 0;min-height:4px}.bars small{font-size:.66rem;color:var(--muted);text-align:center}.bars b{font-size:.78rem}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;z-index:2;cursor:pointer}.sw i{position:absolute;inset:0;background:#d7ccc8;border-radius:99px;transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:var(--red)}.sw input:checked+i::after{left:23px}
.chk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ok-l);color:var(--ok)}
.pg{display:flex;gap:6px;justify-content:center;margin:2px 0}.pg span{width:26px;height:5px;border-radius:9px;background:var(--line)}.pg span.on{background:var(--red)}
.th{width:48px;height:48px;border-radius:9px;object-fit:cover;border:1px solid var(--line);flex:none;background:#f3eeec}
.bellw{position:relative}.bellw b{position:absolute;top:-4px;right:-4px;background:var(--amber);color:#111;font:800 .6rem sans-serif;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#EAE5E2;border-radius:12px;padding:4px}.tabs button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted);font-size:.85rem}.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ov{position:absolute;inset:0;background:rgba(20,12,11,.7);z-index:60;display:grid;place-items:center;padding:16px}.ov .box{background:#fff;border-radius:16px;padding:14px;width:100%;max-height:90%;overflow:auto}.ov img{width:100%;border-radius:10px}
canvas.live{width:100%;height:230px;background:#EEF3EC;border:1px solid var(--line);border-radius:14px}
video.cam{width:100%;border-radius:14px;background:#000;max-height:260px}
.ok{background:var(--ok-l);border:1px solid #bfe0c8;color:var(--ok);border-radius:12px;padding:10px 12px;font-size:.82rem;font-weight:600}
.bad{background:var(--red-l);border:1px solid #F0C9C4;color:var(--red-dd);border-radius:12px;padding:10px 12px;font-size:.82rem;font-weight:600}
.sms{background:#1b1b1d;color:#fff;border-radius:12px;padding:10px 12px;font-size:.8rem}.sms b{font-size:1.1rem;letter-spacing:.15em;color:var(--amber)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.84rem}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
details summary{cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted);margin-top:8px}
.app.wide{width:100%!important;max-width:none;height:100dvh!important;border:0!important;border-radius:0!important;box-shadow:none!important}
body:has(.app.wide){padding:0}
.adm{display:grid;grid-template-columns:230px 1fr;height:100%;overflow:hidden}
.as{background:#141414;color:#E9DAD6;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.as .lg{background:#fff;border-radius:12px;padding:8px;margin-bottom:12px}.as .lg img{width:100%;mix-blend-mode:multiply;display:block}
.as a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;font-size:.88rem;color:#E9DAD6}.as a.on{background:var(--red);color:#fff}
.as .sp{flex:1}.as small{opacity:.6;padding:0 6px}
.as button{background:#2a2a2c;border:0;color:#fff;border-radius:9px;padding:10px}
.am{padding:22px 26px;overflow:auto;background:#F4F1EF}
.at{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.at h2{font-size:1.5rem}.at small{color:var(--muted)}
.pill{font:700 .68rem 'Manrope',sans-serif;padding:4px 10px;border-radius:999px;background:var(--red-l);color:var(--red-dd)}
.astats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.astats .card{margin:0}.astats small{color:var(--muted);font-size:.74rem;font-weight:600}.astats h2{font-size:1.8rem;margin-top:2px}
.agrid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.mrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}.mrow.sel{border-color:var(--red);background:var(--red-l)}
.mrow b{display:block;font-size:.9rem}.mrow small{color:var(--muted);font-size:.74rem}
.dot2{width:11px;height:11px;border-radius:50%;flex:none;background:#bbb}.dot2.live{background:#2e9e4f;box-shadow:0 0 0 4px rgba(46,158,79,.2)}.dot2.paused{background:var(--amber)}
@media(max-width:900px){.adm{grid-template-columns:1fr;grid-template-rows:auto 1fr}.as{flex-direction:row;align-items:center;flex-wrap:wrap}.as .lg{width:90px;margin:0}.as .sp{display:none}.astats{grid-template-columns:1fr 1fr}.agrid{grid-template-columns:1fr}}

.as .nv{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;font-size:.88rem;color:#E9DAD6;background:transparent;text-align:left}.as .nv.on{background:var(--red);color:#fff}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.sg{margin:0}.sg img{width:100%;background:#fff;border:1px dashed var(--line);border-radius:10px;margin:8px 0}
[hidden]{display:none!important}

 verif:{selfie:null,otp:null,pending:null},track:{on:false,trail:[]},reg:{},stack:[],scr:'login'});
let A=DEFAULT();
try{const s=localStorage.getItem(KEY);if(s){A=Object.assign(DEFAULT(),JSON.parse(s))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}try{pushDocs();subDecisions()}catch(e){}}
let scr=A.user?(A.scr&&A.scr!=='login'&&A.scr!=='admin'?A.scr:'home'):'login';
let S={qtab:'my',qvid:null,gvid:null,arange:'7',lastScan:null,geoErr:null};
let timer=null,stream=null,raf=null,watchId=null;

/* ---------- helpers ---------- */
function hist(t,x){A.hist.unshift({t,x,at:now()})}
function toast(t,icon){const d=document.createElement('div');d.className='toast';d.innerHTML=ic(icon||'check')+'<span>'+esc(t)+'</span>';root.appendChild(d);icons();setTimeout(()=>d.remove(),2600)}
function icons(){try{lucide.createIcons()}catch(e){}}
function st(s){return `<span class="st ${esc(String(s).split(' ')[0])}">${esc(s)}</span>`}
function ok(){return A.user&&A.user.status==='Approved'}
function lock(){return `<div class="card"><b>${ic('lock')} Not available yet</b><p class="hint">This section unlocks after an administrator approves your registration.</p><button class="btn" data-go="status">View registration status</button></div>`}
function rid(){return Date.now()+Math.floor(Math.random()*1000)}
function token(){return Math.random().toString(36).slice(2,10).toUpperCase()}
function readImg(file,max,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>cb(null);im.src=fr.result};fr.onerror=()=>cb(null);fr.readAsDataURL(file)}
function qrUrl(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(6,3)}
function dist(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getPos(okf,fail){if(!navigator.geolocation){fail('Location is not supported on this device.');return}navigator.geolocation.getCurrentPosition(p=>okf({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,speed:p.coords.speed}),e=>fail(e&&e.message?e.message:'Location permission denied.'),{enableHighAccuracy:true,timeout:12000,maximumAge:0})}
function fmtD(m){return m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m'}
function notify(kind,x,silent){if(kind&&A.prefs[kind]===false)return;A.notifs.unshift({id:rid(),x,at:now(),read:false});if(!silent){toast(x,'bell');try{if(window.Notification&&Notification.permission==='granted')new Notification('Hunarsaaz Team',{body:x})}catch(e){}}save();updateBell()}
function unread(){return A.notifs.filter(n=>!n.read).length}
function updateBell(){const b=$('#bellbtn');if(!b)return;const n=unread();const old=b.querySelector('b');if(old)old.remove();if(n){const e=document.createElement('b');e.textContent=n;b.appendChild(e)}}
function tick(){if(!A.user)return;const t=Date.now();
 A.visits.forEach(v=>{if(v.status!=='Completed'&&!v.remFired&&A.prefs.visit!==false){const ts=Date.parse(v.date+'T'+v.time);if(!isNaN(ts)&&t>=ts-A.prefs.visitMins*60000&&t<=ts+6*3600000){v.remFired=true;notify('visit','Visit reminder: '+v.customer+' at '+v.time)}}});
 A.items.forEach(i=>{if(i.status==='Assigned'&&!i.remFired&&A.prefs.items!==false&&i.ats&&t-i.ats>=A.prefs.itemMins*60000){i.remFired=true;notify('items','Item pending return: '+i.item)}});
 A.reminders.forEach(r=>{if(!r.fired&&t>=r.due){r.fired=true;notify(null,'Reminder: '+r.text)}});save()}
setInterval(tick,10000);

V.fqrid=()=>{const u=A.user;const payload=`HSS|ID|${u.code||'TM-000000'}|${u.name}`;
 return `<div class="tabs"><button data-qtab="my" class="${S.qtab==='my'?'on':''}">My ID</button><button data-qtab="scan" class="${S.qtab==='scan'?'on':''}">Scan an ID</button></div>`+(S.qtab==='my'?`<div class="card" style="text-align:center"><img src="${LOGO}" style="width:110px;mix-blend-mode:multiply" alt=""><h3>${esc(u.name)}</h3><p class="hint" style="margin:2px 0">Team member ID · ${esc(u.code||'')} · ${esc(u.status)}</p><img class="qr" src="${qrUrl(payload)}" alt="QR"><p class="hint">A real QR code. A supervisor can scan it with this app (Scan an ID tab) or any QR reader to identify you. It contains only your ID code and name, not your CNIC.</p></div>`:scannerUI()+(S.lastScan&&S.lastScan.kind==='id'?S.lastScan.html:''))};
function visitPayload(v){return `HSS|VISIT|${v.id}|${v.token}`}
V.fqrv=()=>{const vs=A.visits;if(!S.qvid||!vs.find(v=>v.id==S.qvid))S.qvid=vs.length?vs[0].id:null;const v=vs.find(x=>x.id==S.qvid);
 return `<div class="card"><h4>Visit</h4>${vs.length?`<select id="qv">${vs.map(x=>`<option value="${x.id}" ${x.id==S.qvid?'selected':''}>${esc(x.customer)} · ${esc(x.date)} ${x.qr?'✓':''}</option>`).join('')}</select>${v.qr?`<div class="ok" style="margin-top:10px">${ic('check')} Verified by QR on ${esc(v.qr.at)}</div>`:`<p class="hint" style="margin-bottom:0">Scan the QR code displayed at the visit site to verify this visit.</p>`}`:'<p class="hint">No visits yet. Submit a visit first.</p>'}</div>${v&&!v.qr?scannerUI():''}${v?`<div class="card" style="text-align:center"><h4>Site QR for this visit</h4><img class="qr" src="${qrUrl(visitPayload(v))}" alt="QR"><p class="hint">This is the code that would be printed or displayed at the site (kept by the administrator). You can scan it from another device or a printed copy.</p></div>`:''}${S.lastScan&&S.lastScan.kind==='visit'?S.lastScan.html:''}`};
V.fgps=()=>{const vs=A.visits;if(!S.gvid||!vs.find(v=>v.id==S.gvid))S.gvid=vs.length?vs[0].id:null;const v=vs.find(x=>x.id==S.gvid);
 return `<div class="card"><h4>Verify visit location</h4>${vs.length?`<select id="gv">${vs.map(x=>`<option value="${x.id}" ${x.id==S.gvid?'selected':''}>${esc(x.customer)} · ${esc(x.date)} ${x.gps&&x.gps.ok?'✓':''}</option>`).join('')}</select>
 <dl class="kv" style="margin-top:12px"><dt>Site location</dt><dd>${v.site?v.site.lat.toFixed(5)+', '+v.site.lng.toFixed(5):'Not set'}</dd><dt>Last check</dt><dd>${v.gps?(v.gps.ok?'Verified':'Failed')+' · '+esc(v.gps.at):'None'}</dd>${v.gps?`<dt>Position</dt><dd>${v.gps.lat.toFixed(5)}, ${v.gps.lng.toFixed(5)}</dd><dt>Accuracy</dt><dd>±${Math.round(v.gps.acc)} m</dd>${v.gps.dist!=null?`<dt>Distance from site</dt><dd>${fmtD(v.gps.dist)}</dd>`:''}`:''}</dl>
 ${v.gps?`<div class="${v.gps.ok?'ok':'bad'}" style="margin-top:10px">${v.gps.ok?'Location verified'+(v.gps.dist!=null?' (within 150 m of the site)':' (position recorded; no site location was set)'):'Too far from the site: '+fmtD(v.gps.dist)+' away (limit 150 m)'}${v.gps.manual?' · entered manually':''}</div>`:''}
 <div class="grid2" style="margin-top:12px"><button class="btn" data-act="gpsverify">${ic('navigation')} Verify location</button><button class="btn ghost" data-act="gpsset">${ic('crosshair')} Set as site</button></div><div id="gerr">${S.geoErr?`<div class="note" style="margin-top:10px">${esc(S.geoErr)}</div>`:''}</div>

V.flive=()=>{const t=A.track;const last=t.trail[t.trail.length-1];let d=0;for(let i=1;i<t.trail.length;i++)d+=dist(t.trail[i-1],t.trail[i]);

const AUTH=['login','register','otp'];
function stopAll(){clearInterval(timer);timer=null;if(admTimer){clearInterval(admTimer);admTimer=null}if(admUnsub){admUnsub();admUnsub=null}cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}

function handleScan(text){
 if(scr==='fqrv'){const v=A.visits.find(x=>x.id==S.qvid);
  if(text===visitPayload(v)){v.qr={at:now()};hist('Visit','Visit QR-verified: '+v.customer);S.lastScan={kind:'visit',html:`<div class="ok">${ic('check')} QR matched. Visit verified.</div>`};save();toast('Visit verified by QR','scan-qr-code')}
  else{const other=A.visits.find(x=>text===visitPayload(x));S.lastScan={kind:'visit',html:`<div class="bad">${other?'This QR belongs to a different visit ('+esc(other.customer)+').':'This QR code is not a visit code for this app.'}</div>`}}
  render();return}
 if(scr==='fqrid'){const p=text.split('|');let html;if(p[0]==='HSS'&&p[1]==='ID'){const mine=text===`HSS|ID|${A.user.code}|${A.user.name}`;html=`<div class="card"><h4>Team member ID</h4><dl class="kv"><dt>Name</dt><dd>${esc(p[3]||'')}</dd><dt>ID code</dt><dd>${esc(p[2]||'')}</dd><dt>Check</dt><dd>${mine?'Matches this device’s member':'Valid format; verify with the administrator'}</dd></dl></div>`}else html=`<div class="bad">Not a team member ID code.</div>`;S.lastScan={kind:'id',html};render()}}
async function camStart(){const v=$('#sv');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.hidden=false;$('#sbox').hidden=true;await v.play();scanLoop()}catch(e){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#sres').innerHTML=`<div class="note">Camera is not available here (${esc(e&&e.name?e.name:'blocked')}). Use "From photo" to scan a picture of the QR code.</div>`}}
function scanLoop(){const v=$('#sv'),c=$('#sc');if(!v||!stream)return;if(v.readyState===v.HAVE_ENOUGH_DATA){c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.drawImage(v,0,0);const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,d.width,d.height);if(r&&r.data){stopAll();handleScan(r.data);return}}raf=requestAnimationFrame(scanLoop)}
function decodeFile(file){const img=new Image();img.onload=()=>{const sc=Math.min(1,1100/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});if(r&&r.data)handleScan(r.data);else $('#sres').innerHTML='<div class="bad">No QR code found in this photo. Center the code and use good light.</div>'};img.src=URL.createObjectURL(file)}

function addPoint(p){A.track.trail.push({lat:p.lat,lng:p.lng,acc:p.acc||0,t:Date.now()});if(A.track.trail.length>500)A.track.trail.shift();save();pushTrack()}
function startWatch(){if(watchId!=null)return;if(!navigator.geolocation){S.geoErr='Location is not supported on this device.';A.track.on=false;return}watchId=navigator.geolocation.watchPosition(p=>{S.geoErr=null;const n=$('#lerr');if(n)n.textContent='';addPoint({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});if(scr==='flive')refreshLive()},e=>{if(e&&e.code===1){S.geoErr='Location is blocked in this view (permission denied). Allow location for this site in your browser or app settings, or use a simulated location to demo tracking.';A.track.on=false;stopWatch();save();if(scr==='flive')render()}else{S.geoErr='Waiting for a location fix…';const n=$('#lerr');if(n)n.textContent=S.geoErr}},{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}
let simTimer=null,simAng=null;
function stopSim(){if(simTimer){clearInterval(simTimer);simTimer=null}}
function startSim(){if(simTimer)return;const step=()=>{const t=A.track.trail,l=t[t.length-1],b=l?{lat:l.lat,lng:l.lng}:{lat:31.5204,lng:74.3587};simAng=(simAng===null?Math.random()*6.28:simAng)+(Math.random()-.5)*.8;const a=simAng;const m=18+Math.random()*22;addPoint({lat:b.lat+Math.sin(a)*m/111320,lng:b.lng+Math.cos(a)*m/(111320*Math.cos(b.lat*Math.PI/180)),acc:12});if(scr==='flive')refreshLive()};simTimer=setInterval(step,4000);step()}
function stopWatch(){stopSim();if(watchId!=null){try{navigator.geolocation.clearWatch(watchId)}catch(e){}watchId=null}}
function drawLive(){const c=$('#lv');if(!c)return;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext('2d');x.scale(2,2);const W=r.width,H=r.height;x.clearRect(0,0,W,H);x.strokeStyle='#d6e0d3';x.lineWidth=1;for(let i=1;i<8;i++){x.beginPath();x.moveTo(W*i/8,0);x.lineTo(W*i/8,H);x.stroke()}for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,H*i/5);x.lineTo(W,H*i/5);x.stroke()}
 const t=A.track.trail;if(!t.length){x.fillStyle='#8a8582';x.font='13px Inter,sans-serif';x.textAlign='center';x.fillText('No positions yet. Turn on sharing.',W/2,H/2);return}
 const la=t.map(p=>p.lat),lo=t.map(p=>p.lng);let a0=Math.min(...la),a1=Math.max(...la),o0=Math.min(...lo),o1=Math.max(...lo);const kx=Math.cos((a0+a1)/2*Math.PI/180);let dx=(o1-o0)*kx,dy=a1-a0;const minSpan=0.0004;if(dx<minSpan){o0-=minSpan/2/kx;dx=minSpan}if(dy<minSpan){a0-=minSpan/2;dy=minSpan}const pad=26,sc=Math.min((W-2*pad)/dx,(H-2*pad)/dy);const ox=(W-dx*sc)/2,oy=(H-dy*sc)/2;const P=p=>[ox+(p.lng-o0)*kx*sc,H-oy-(p.lat-a0)*sc];
 x.strokeStyle='#C8433A';x.lineWidth=3;x.lineJoin='round';x.beginPath();t.forEach((p,i)=>{const q=P(p);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.stroke();
 const s0=P(t[0]);x.fillStyle='#141414';x.beginPath();x.arc(s0[0],s0[1],5,0,7);x.fill();const e=P(t[t.length-1]);x.fillStyle='rgba(200,67,58,.25)';x.beginPath();x.arc(e[0],e[1],13,0,7);x.fill();x.fillStyle='#C8433A';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(e[0],e[1],7,0,7);x.fill();x.stroke()}
function refreshLive(){drawLive();const t=A.track.trail,last=t[t.length-1];let d=0;for(let i=1;i<t.length;i++)d+=dist(t[i-1],t[i]);const k=$('#lstats');if(k)k.innerHTML=`<dt>Points recorded</dt><dd>${t.length}</dd><dt>Distance travelled</dt><dd>${fmtD(d)}</dd><dt>Last position</dt><dd>${last?last.lat.toFixed(5)+', '+last.lng.toFixed(5):'—'}</dd><dt>Accuracy</dt><dd>${last?'±'+Math.round(last.acc||0)+' m':'—'}</dd><dt>Last update</dt><dd>${last?new Date(last.t).toLocaleTimeString():'—'}</dd>`}

function ago(ts){const s=Math.max(0,Math.round((Date.now()-ts)/1000));if(s<60)return s+' s ago';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return new Date(ts).toLocaleDateString()}

function padSetup(sel,clr){const c=$(sel);if(!c)return;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext('2d');x.scale(2,2);x.lineWidth=2.4;x.lineCap='round';x.strokeStyle='#141414';let dr=false;const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
 c.addEventListener('pointerdown',e=>{dr=true;c.setPointerCapture(e.pointerId);const p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke();c._d=1});

 const b=clr&&$(clr);if(b)b.onclick=()=>{x.clearRect(0,0,c.width,c.height);c._d=0}}

document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.getAttribute('id');
 if(id==='fr'){A.reg={name:$('#rn').value.trim(),mobile:$('#rm').value.trim(),cnic:$('#rc').value.trim(),address:$('#ra').value.trim(),code:'TM-'+Math.floor(100000+Math.random()*900000),photo:A.reg.photo||null};const f=$('#rp').files[0];const next=()=>{ACT.otpsend();go('otp')};if(f)readImg(f,480,u=>{A.reg.photo=u;next()});else next();return}
 if(id==='fo'){const o=A.verif.pending;const val=$('#oc').value.trim();if(!o){toast('Send a code first','x');return}if(Date.now()>o.exp){toast('Code expired. Send a new one.','x');return}o.tries++;if(val!==o.code){if(o.tries>=3){A.verif.pending=null;save();toast('Too many attempts. New code sent.','x');ACT.otpsend()}else{save();toast('Wrong code','x')}return}
  const u=Object.assign({},A.reg,{status:'Pending'});const reg=A.reg;A=DEFAULT();A.user=u;A.verif.otp={at:now()};hist('Registration','Registration submitted');notify('status','Registration submitted for review',true);A.stack=[];toast('Registration submitted for review');go('status');return}
 if(id==='fd'){const f=$('#dfi').files[0],ty=$('#dtp').value;const fin=u=>{A.docs.unshift({id:rid(),type:ty,file:f?f.name:'captured-document',status:'Submitted',date:todayStr(),thumb:u});hist('Document','Document submitted: '+ty);notify('status','Document submitted for verification: '+ty,true);save();toast('Document submitted');render()};if(f&&f.type.indexOf('image')===0)readImg(f,800,fin);else fin(null);return}
 if(id==='fv'){const sc=$('#vsig');if(!sc||!sc._d){toast('Please add the customer signature','pen-line');return}const sg={img:sigImg(sc),by:($('#vsn').value.trim()||$('#vc').value),at:now()};const v={sig:sg,id:rid(),customer:$('#vc').value,location:$('#vl').value,date:$('#vdt').value,time:$('#vt').value,purpose:$('#vp').value,task:$('#vk').value,status:'Submitted',notes:$('#vn').value,site:S.draftSite?{lat:S.draftSite.lat,lng:S.draftSite.lng}:null,qr:null,gps:null,token:token()};A.visits.unshift(v);logSig('Visit',v.customer+' · '+v.purpose,sg);S.draftSite=null;hist('Visit','Visit record submitted: '+v.customer);notify('visit','Visit submitted: '+v.customer,true);save();toast('Visit submitted');A.stack=[];go('visits');return}
 if(id==='fi'){const ic0=$('#isig');if(!ic0||!ic0._d){toast('Please sign the report','pen-line');return}const sg={img:sigImg(ic0),by:A.user.name,at:now()};const f=$('#ie').files[0];const fin=u=>{A.incidents.unshift({id:rid(),type:$('#it').value,title:$('#ti').value,date:todayStr(),status:'Open',thumb:u,sig:sg});logSig('Incident',$('#ti').value,sg);hist('Incident','Incident reported: '+$('#ti').value);notify('incident','Incident reported: '+$('#ti').value,true);save();toast('Report submitted');render()};if(f)readImg(f,800,fin);else fin(null);return}
 if(id==='fpr'){A.user.mobile=$('#pm').value;A.user.address=$('#pa').value;hist('Profile','Profile updated');save();toast('Profile saved');render();return}
 if(id==='frem'){const m=Math.max(1,parseInt($('#rmin').value)||1);A.reminders.push({id:rid(),text:$('#rtx').value,due:Date.now()+m*60000,fired:false});save();toast('Reminder set for '+m+' min','bell');render();return}
});
if(A.track.on&&A.user)startWatch();
render();
})();
</script></body></html>
