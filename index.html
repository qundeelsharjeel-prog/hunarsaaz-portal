<style>
:root{--red:#c62f2a;--red-d:#a32320;--red-l:#fdecea;--ink:#1b2430;--mut:#667085;--line:#e5e8ee;--bg:#f4f5f8;--card:#fff;--green:#12805c;--green-l:#e3f6ee;--amber:#b25e09;--amber-l:#fff3dd;--blue:#1d5fd1;--blue-l:#e6efff;--rad:12px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:600;transition:.15s}
.btn:hover{background:#f7f8fa}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d)}
.btn.dng{background:#d92d20;border-color:#d92d20;color:#fff}
.btn.sm{padding:6px 9px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.full{width:100%;justify-content:center;padding:11px}
.icon-btn{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--mut)}
.icon-btn:hover{color:var(--ink);background:#f7f8fa}
.icon-btn.del:hover{color:#d92d20;background:#fef3f2;border-color:#fecdca}
/* inputs */
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-weight:600;font-size:13px}
.fld label i{color:var(--red);font-style:normal}
.inp{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px 12px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(198,47,42,.14)}
textarea.inp{min-height:84px;resize:vertical}
.pw{position:relative}.pw .inp{padding-right:42px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);padding:6px}
/* auth */
.auth{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.auth-l{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px;gap:22px;overflow:auto}
.auth-l .ban{border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.auth-l .ban img{display:block;width:100%;height:auto}
.auth-l .lg{display:flex;align-items:center;gap:18px}
.auth-l .lg img{width:150px;height:auto}
.auth-l h1{margin:0 0 6px;font-size:26px;line-height:1.2}
.auth-l p{margin:0;color:var(--mut)}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc-card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;background:#fafbfc}
.svc-card .ib{width:34px;height:34px;border-radius:9px;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.svc-card b{display:block;font-size:13px}.svc-card span{font-size:12px;color:var(--mut)}
.auth-r{display:flex;align-items:center;justify-content:center;padding:28px}
.auth-box{width:100%;max-width:440px}
.tabs{display:flex;background:#eceef2;border-radius:11px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:700;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.auth-box h2{margin:0 0 4px;font-size:22px}
.auth-box .sub{color:var(--mut);margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.err{background:#fef3f2;border:1px solid #fecdca;color:#b42318;padding:9px 12px;border-radius:9px;font-size:13px}
.ok{background:var(--green-l);border:1px solid #b7e8d2;color:var(--green);padding:9px 12px;border-radius:9px;font-size:13px}
.demo{margin-top:18px;border:1px dashed #cfd4dc;border-radius:12px;padding:12px;background:#fff}
.demo h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.demo button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:#fafbfc;border-radius:9px;padding:8px 10px;margin-top:6px}
.demo button:hover{border-color:var(--red);background:var(--red-l)}
.demo small{color:var(--mut);display:block}
/* multiselect */
.ms{position:relative}
.ms-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:8px 12px;min-height:42px;text-align:left}
.ms-btn.open{border-color:var(--red);box-shadow:0 0 0 3px rgba(198,47,42,.14)}
.ms-ph{color:#98a2b3}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--red-l);color:var(--red-d);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.ms-pan{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.16);padding:6px;max-height:300px;overflow:auto}
.ms-opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:9px;cursor:pointer}
.ms-opt:hover{background:#f6f7f9}
.ms-opt input{margin-top:3px;accent-color:var(--red);width:16px;height:16px}
.ms-opt b{display:block;font-size:13px}.ms-opt span{font-size:12px;color:var(--mut)}
/* shell */
.shell{display:flex;min-height:100%}
.side{width:268px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .2s}
.side .brand{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.side .brand img{width:150px;height:auto;display:block}
.side nav{flex:1;overflow:auto;padding:10px 10px 16px}
.grp{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#98a2b3;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;color:#344054;font-weight:500;text-align:left}
.nav:hover{background:#f4f5f8}
.nav.on{background:var(--red-l);color:var(--red-d);font-weight:700}
.side .foot{border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.foot .who{flex:1;min-width:0}.foot .who b,.foot .who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot small{color:var(--mut)}
.main{flex:1;margin-left:268px;min-width:0}
.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.top h3{margin:0;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none}
.pill{background:#f1f3f6;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:#475467;display:inline-flex;gap:6px;align-items:center;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.role{background:var(--red-l);color:var(--red-d)}
.page{padding:24px;max-width:1380px}
.scrim{display:none}
/* dashboard */
.hero{border-radius:16px;overflow:hidden;box-shadow:var(--sh);position:relative;background:#cfe3f5}
.hero img{display:block;width:100%;height:210px;object-fit:cover;object-position:50% 62%}
.welcome{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 6px}
.welcome h2{margin:0;font-size:22px}.welcome p{margin:2px 0 0;color:var(--mut)}
.sec{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sec h4{margin:0;font-size:15px}.sec .ib{width:28px;height:28px;border-radius:8px;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh)}
.card .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .hd h4{margin:0;font-size:14px}
.card .bd{padding:14px 16px}
.row-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f0f1f4}
.row-line:last-child{border:0}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.quick button{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;text-align:left;font-weight:600}
.quick button:hover{border-color:var(--red);background:var(--red-l)}
.quick .n{margin-left:auto;color:var(--mut);font-weight:600;font-size:12px}
.bar{height:8px;background:#eceef2;border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
/* module */
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.mhead h2{margin:0;font-size:21px}.mhead p{margin:2px 0 0;color:var(--mut)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 16px;min-width:130px}
.stat small{color:var(--mut);font-weight:600;display:block}.stat b{font-size:20px}
.tools{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#98a2b3}
.search .inp{padding-left:36px}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:#f8f9fb;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#667085;padding:10px 14px;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
th.na{cursor:default}
td{padding:11px 14px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
tr:hover td{background:#fafbfc}
td.act{white-space:nowrap;text-align:right}
td.act .icon-btn{margin-left:4px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#eef0f4;color:#475467;white-space:nowrap}
.badge.g{background:var(--green-l);color:var(--green)}.badge.a{background:var(--amber-l);color:var(--amber)}.badge.r{background:#fee4e2;color:#b42318}.badge.b{background:var(--blue-l);color:var(--blue)}
.empty{padding:46px 16px;text-align:center;color:var(--mut)}
.foot-note{padding:10px 14px;color:var(--mut);font-size:12.5px}
/* modal */
.mback{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:92vh;max-height:calc(100dvh - 36px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(16,24,40,.3)}
.modal>form{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;margin:0}
.modal .mh{flex-shrink:0}
.modal .mb{flex:1 1 auto;min-height:0;overflow-y:auto}
.modal .mf{flex-shrink:0;background:#fff;position:relative;z-index:1}
.modal textarea.inp{min-height:84px;max-height:180px;resize:vertical;display:block}
.modal.sm{max-width:430px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:17px}
.modal .mb{padding:18px 20px;overflow:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.cbx{display:flex;flex-wrap:wrap;gap:8px}
.cbx label{display:flex;align-items:center;gap:7px;border:1px solid #d0d5dd;border-radius:9px;padding:7px 11px;font-weight:500;cursor:pointer}
.cbx input{accent-color:var(--red)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dl div small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.dl .full{grid-column:1/-1}
.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 16px;border-radius:11px;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:9px;align-items:center;animation:up .25s}
.toast.bad{background:#b42318}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:1000px){.auth{grid-template-columns:1fr}.auth-l{border:0;border-bottom:1px solid var(--line)}.cols{grid-template-columns:1fr}}
@media(max-width:900px){
 .side{transform:translateX(-100%)}.side.open{transform:none}
 .scrim.show{display:block;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:35}
 .main{margin-left:0}.burger{display:inline-flex}.page{padding:16px}.top{padding:0 14px}
 .pill.co{display:none}
}
@media(max-width:560px){.two,.fgrid,.dl,.svc-grid{grid-template-columns:1fr}.hero img{height:140px}}

.kpis{margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--line)}
.kpi small{color:var(--mut);font-weight:600;font-size:12px}
.kpi b{font-size:23px;line-height:1.15}
.kpi span{color:var(--mut);font-size:12px}
.kpi.red{border-left-color:#d92d20}.kpi.red b{color:#b42318}
.kpi.amber{border-left-color:#f79009}.kpi.amber b{color:var(--amber)}
.kpi[data-a]:hover{border-color:var(--red);box-shadow:0 4px 14px rgba(16,24,40,.1)}
.card{margin-bottom:16px}
.card .ch{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .ch h3{margin:0;font-size:14.5px}
.card .cb{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.tbl td,.tbl th{padding:9px 11px}
.tbl small{color:var(--mut)}
.mini{width:100%;font-size:13px}.mini td,.mini th{padding:6px 8px;border-bottom:1px solid #f0f1f4}
.muted{color:var(--mut)}
.empty.small{padding:20px 10px}
.hrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.hrow>span{width:150px;font-size:13px;flex:none}.hrow .bar{flex:1}.hrow b{width:70px;text-align:right;font-size:13px}
.bar.red i{background:#d92d20}.bar.amber i{background:#f79009}
.alr{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:9px;margin-bottom:6px;background:#fafbfc;border:1px solid #f0f1f4;cursor:pointer;font-size:13px}
.alr:hover{border-color:var(--red)}
.alr i{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:#98a2b3}
.alr.red i{background:#d92d20}.alr.amber i{background:#f79009}
.qa{display:flex;flex-wrap:wrap;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:#eceef2;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.btn.wf{background:var(--red-l);border-color:#f6c6c3;color:var(--red-d)}
.btn.wf:hover{background:#fbd9d6}
.detail{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.detail h4{margin:6px 0}
.receipt{border:1px dashed #cfd4dc;border-radius:12px;padding:18px}.receipt h3{margin:0 0 10px}
.modal.wide{max-width:860px}
.modal .mb ul{padding-left:20px;margin:0;line-height:2}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rc .cb{display:flex;flex-direction:column;gap:6px}.rc small{color:var(--mut)}.rbtns{display:flex;gap:6px;margin-top:6px}
.chans{display:flex;flex-wrap:wrap;gap:16px}.sw{display:flex;gap:8px;align-items:center;font-weight:600}.sw input{accent-color:var(--red);width:16px;height:16px}
.chat{min-height:240px;max-height:380px;overflow:auto;background:#f8f9fb;border-radius:12px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 12px;border-radius:12px;font-size:13.5px}
.msg.ai.tb{max-width:100%;width:100%;overflow:auto}.msg.ai.tb .tw{overflow:auto}.msg.ai.tb table{font-size:12.5px}.msg.me{align-self:flex-end;background:var(--red);color:#fff}.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.aiform{display:flex;gap:8px}
.chip.btn{border:0;cursor:pointer}
.phone{max-width:440px;margin:0 auto 16px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:18px}
.phone .pt{display:flex;justify-content:space-between;align-items:center}
.pstat{background:var(--green-l);color:var(--green);border-radius:10px;padding:8px 12px;margin:12px 0;font-weight:600;font-size:13px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);background:#fafbfc;border-radius:14px;padding:14px;text-align:left}
.mbtn:hover{border-color:var(--red);background:var(--red-l)}.mbtn .ico{color:var(--red);width:22px;height:22px}.mbtn small{color:var(--mut)}
.bellb{position:relative}.bellb em{position:absolute;top:-6px;right:-6px;background:#d92d20;color:#fff;border-radius:99px;font-size:10px;font-style:normal;padding:1px 5px;font-weight:700}
.tbl.perm td.c,.tbl.perm th.c{text-align:center}.tbl.perm th small{writing-mode:vertical-rl;transform:rotate(180deg);text-transform:none;letter-spacing:0}
th.c,td.c{text-align:center}
/* gantt */
.gantt{position:relative;padding:10px 16px 14px}
.grow{display:flex;align-items:center;min-height:38px;border-bottom:1px solid #f4f5f7}
.gl{width:260px;flex:none;padding-right:10px}.gl b{display:block;font-size:13px}.gl small{color:var(--mut);font-size:11.5px}
.gt{flex:1;position:relative;height:22px;background:repeating-linear-gradient(90deg,#f6f7f9 0,#f6f7f9 1px,transparent 1px,transparent 10%)}
.gbar{position:absolute;top:2px;height:18px;background:#d6e4ff;border-radius:5px;overflow:hidden;min-width:8px}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:#3b82f6}
.gbar span{position:relative;font-size:11px;font-weight:700;padding-left:6px;color:#0b2a66}

function pickRule(type,amount,project){
  var rules=D('approvalRules').filter(function(r){return r.type===type&&amount>=num(r.min)&&(r.max===''||r.max==null||amount<=num(r.max))&&(!r.project||r.project===project);});
  rules.sort(function(a,b){return (RANK[a.approverRole]||0)-(RANK[b.approverRole]||0);});
  return rules[0]||null;
}
function submitApproval(type,modId,row,amount,title,project){
  var ex=D('approvals').filter(function(a){return a.srcMod===modId&&a.srcId===row._id&&a.status==='Pending';})[0];
  if(ex){toast('Already submitted for approval.',true);return null;}
  var rule=pickRule(type,num(amount),project);
  var a=add('approvals',{request:title,type:type,srcMod:modId,srcId:row._id,project:project||'',amount:num(amount),requestedBy:S.user.name,date:todayISO(),requiredRole:rule?rule.approverRole:'Project Manager',level:rule?rule.level:'Level 1',status:'Pending',decidedBy:'',decidedOn:'',comments:''});
  var mp=APPROVE_MAP[type];
  if(mp&&mp.mod==='purchaseReq'){row.status='Pending Approval';row.level=a.level;}
  if(mp&&mp.mod==='purchaseOrders')row.status='Pending Approval';
  if(mp&&mp.mod==='expenses')row.status='Pending Approval';
  notify('Approval requested: '+title+' ('+money(amount)+') — needs '+a.requiredRole);
  toast('Submitted for approval ('+a.level+' → '+a.requiredRole+')');return a;
}
function decideApproval(a,ok,comment){
  if(!isApprover(S.user.role,a.requiredRole)&&!S.user.isSuper){toast('Only '+a.requiredRole+' or higher can decide this approval.',true);return false;}
  a.status=ok?'Approved':'Rejected';a.decidedBy=S.user.name;a.decidedOn=todayISO();if(comment)a.comments=comment;
  var mp=APPROVE_MAP[a.type];
  if(mp){var src=D(mp.mod).filter(function(r){return r._id===a.srcId;})[0];
    if(src){var fld=mp.field||'status';var val=ok?(mp.field?mp.okv:mp.ok):(mp.field?mp.nov:mp.no);if(val!==null&&val!==undefined)src[fld]=val;}}
  notify('Approval '+a.status.toLowerCase()+': '+a.request);
  return true;
}

function lineRowHTML(f,row){
  return '<div class="lrow">'+f.cols.map(function(c){
    var v=row&&row[c.key]!=null?row[c.key]:'';var w=c.w||1;
    if(c.type==='ref'){var os=refOpts(c.opts);return '<select class="inp" data-c="'+c.key+'" style="flex:'+(w*1.6)+'"><option value="">'+esc(c.label)+'</option>'+os.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';}
    if(c.type==='select'){var os2=c.opts.split(',');return '<select class="inp" data-c="'+c.key+'" style="flex:'+w+'">'+os2.map(function(o){return '<option'+((v||os2[0])===o?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';}
    return '<input class="inp" data-c="'+c.key+'" type="'+(c.type==='number'||c.type==='money'?'number':'text')+'"'+(c.type==='number'||c.type==='money'?' step="any" min="0"':'')+' placeholder="'+esc(c.label)+'" value="'+esc(v)+'" style="flex:'+w+'">';
  }).join('')+'<button type="button" class="icon-btn del" data-a="rmline" title="Remove">'+ic('x')+'</button></div>';
}
function fieldHTML(f,v,isNew){
  if(f.type==='hidden')return '';
  if(v==null)v='';
  var lab='<label>'+esc(f.label)+((f.req||(f.type==='password'&&isNew))?' <i>*</i>':'')+'</label>';
  var full=(['textarea','multi','lines','files'].indexOf(f.type)>-1)?' full':'';
  var inp;
  if(f.type==='select')inp='<select class="inp" name="'+f.key+'">'+f.opts.map(function(o){return '<option'+(String(v||f.opts[0])===o?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
  else if(f.type==='ref'){var os=refOpts(f.opts);if(v&&os.indexOf(v)<0)os.push(v);inp='<select class="inp" name="'+f.key+'"><option value="">— select —</option>'+os.map(function(o){return '<option'+(String(v)===o?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';}
  else if(f.type==='textarea')inp='<textarea class="inp" name="'+f.key+'">'+esc(v)+'</textarea>';
  else if(f.type==='multi'){var cur=Array.isArray(v)?v:[];inp='<div class="cbx">'+SERVICES.map(function(s){return '<label><input type="checkbox" name="'+f.key+'" value="'+s.id+'"'+(cur.indexOf(s.id)>-1?' checked':'')+'>'+esc(s.short)+'</label>';}).join('')+'</div>';}
  else if(f.type==='lines'){var rows=Array.isArray(v)?v:[];inp='<div class="lines" data-lines="'+f.key+'">'+rows.map(function(r){return lineRowHTML(f,r);}).join('')+'</div><button type="button" class="btn sm" data-a="addline" data-k="'+f.key+'">'+ic('plus')+'Add line</button>';}
  else if(f.type==='files'){var fl=Array.isArray(v)?v:[];inp='<div class="chips" data-existing="'+f.key+'" data-json="'+esc(JSON.stringify(fl))+'">'+fl.map(function(x){return '<span class="chip">'+esc(x.name)+'</span>';}).join('')+'</div><input class="inp" type="file" name="'+f.key+'" multiple>';}
  else if(f.type==='password')inp='<input class="inp" name="'+f.key+'" type="text" autocomplete="off" placeholder="'+(isNew?'Set a password':'Leave blank to keep current')+'">';
  else{var t=(f.type==='money'||f.type==='number')?'number':f.type;inp='<input class="inp" name="'+f.key+'" type="'+t+'"'+(t==='number'?' step="any" min="0"':'')+(f.ro?' readonly placeholder="auto"':'')+' value="'+esc(v)+'">';}
  return '<div class="fld'+full+'">'+lab+inp+'</div>';
}
function readFields(form,fields,cur,isNew){
  var fd=new FormData(form),obj={},err='';
  fields.forEach(function(f){
    if(err)return;
    var v;
    if(f.type==='hidden'){obj[f.key]=cur?cur[f.key]:'';return;}
    if(f.type==='multi'){v=fd.getAll(f.key);if(!v.length&&f.req)err=f.label+' is required.';}
    else if(f.type==='lines'){
      var box=form.querySelector('[data-lines="'+f.key+'"]');v=[];
      if(box)[].forEach.call(box.querySelectorAll('.lrow'),function(r){var o={},any=false;f.cols.forEach(function(c){var el=r.querySelector('[data-c="'+c.key+'"]');var x=el?String(el.value).trim():'';if(c.type==='number'||c.type==='money'){x=x===''?'':Number(x);if(x!==''&&(isNaN(x)||x<0)){err=f.label+': '+c.label+' must be a positive number.';}}if(x!==''&&!(c.type==='select'&&c.opts&&x===c.opts.split(',')[0]))any=true;o[c.key]=x;});if(any)v.push(o);});
      if(f.req&&!v.length&&!err)err=f.label+': add at least one line.';
    }
    else if(f.type==='files'){
      var ex=[];try{ex=JSON.parse(form.querySelector('[data-existing="'+f.key+'"]').getAttribute('data-json')||'[]');}catch(e){}
      var inp=form.querySelector('input[type=file][name="'+f.key+'"]');
      if(inp&&inp.files)[].forEach.call(inp.files,function(fl){ex.push({name:fl.name,size:fl.size,date:todayISO()});});
      v=ex;
    }
    else{
      v=String(fd.get(f.key)==null?'':fd.get(f.key)).trim();
      if(f.type==='password'){if(isNew&&!v)err='Password is required.';else if(v&&v.length<6)err='Password must be at least 6 characters.';}
      else if(f.ro){}
      else if(f.req&&!v)err=f.label+' is required.';
      else if(f.type==='email'&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))err='Enter a valid email address.';
      else if((f.type==='number'||f.type==='money')&&v!==''){if(isNaN(Number(v))||Number(v)<0)err=f.label+' must be a positive number.';else v=Number(v);}
      else if(/^(progress|plannedProgress)$/.test(f.key)&&Number(v)>100)err=f.label+' cannot exceed 100%.';
      else if(f.ro&&v!==''&&(f.type==='number'||f.type==='money'))v=Number(v);
    }
    obj[f.key]=v;
  });
  return {obj:obj,err:err};
}
function defaultsFor(m,preset){
  var o={};
  m.fields.forEach(function(f){
    if(f.type==='date'&&/^(date|issued|orderDate|invDate|raised)$/.test(f.key))o[f.key]=todayISO();
  });
  if(m.numKey&&m.numPrefix)o[m.numKey]=nextNo(m.id,m.numKey,m.numPrefix);
  if(m.defaults)for(var k in m.defaults)o[k]=typeof m.defaults[k]==='function'?m.defaults[k]():m.defaults[k];
  if(preset)for(var k2 in preset)o[k2]=preset[k2];
  return o;
}

function saveRecord(form){
  var md=S.modal,m=BYID[md.mod],isNew=!md.id,cur=isNew?null:findRow(m,md.id);
  var rd=readFields(form,m.fields,cur,isNew),obj=rd.obj,err=rd.err;
  if(!err&&m.validate)err=m.validate(obj,cur,isNew)||'';
  if(err){var el=$('#form-err');if(el)el.innerHTML='<div class="err" style="margin-bottom:12px">'+esc(err)+'</div>';return;}
  var rows=rowsOf(m);
  if(cur){
    if(m.store==='accounts'){if(!obj.password)obj.password=cur.password;if(cur.role==='superadmin'){obj.services=ALL.slice();obj.status='Active';}
      if(cur.email.toLowerCase()!==String(obj.email).toLowerCase()&&DB.data[cur.email.toLowerCase()]){DB.data[String(obj.email).toLowerCase()]=DB.data[cur.email.toLowerCase()];delete DB.data[cur.email.toLowerCase()];}}
    else if(m.id==='users'&&!obj.password)obj.password=cur.password;
    for(var k in obj)cur[k]=obj[k];
    if(m.compute)m.compute(cur,false);
    if(m.after)m.after(cur,false);
    if(m.store==='accounts'&&S.user&&S.user.acct&&S.user.acct._id===cur._id){S.user.acct=cur;S.user.services=cur.services;}
    toast(m.noun+' updated');
  }else{
    obj._id=uid();
    if(m.store==='accounts'){obj.role='admin';obj.slug=slugOf(obj.company);var base=obj.slug,n=1;while(DB.accounts.some(function(a){return a.slug===obj.slug;}))obj.slug=base+(++n);}
    if(m.compute)m.compute(obj,false);
    rows.unshift(obj);
    if(m.after)m.after(obj,true);
    toast(m.noun+' created');
  }
  save();closeModal();renderApp();
}
function deleteRecord(id){
  var m=BYID[S.modal.mod],rows=rowsOf(m),i=-1;
  rows.forEach(function(r,x){if(r._id===id)i=x;});
  if(i<0){closeModal();return;}
  if(m.store==='accounts'){var a=rows[i];if(a.role==='superadmin'){closeModal();toast('The super admin account cannot be deleted.',true);return;}delete DB.data[a.email.toLowerCase()];}
  var row=rows[i];
  rows.splice(i,1);if(m.onDelete)m.onDelete(row);
  save();closeModal();renderApp();toast(m.noun+' deleted');
}
function runAction(modId,actId,rowId){
  var m=BYID[modId],r=findRow(m,rowId);if(!r)return;
  var a=(m.actions||[]).filter(function(x){return x.id===actId;})[0];if(!a)return;
  closeModal();
  if(a.when&&!a.when(r)){toast('This action is not available for the current status.',true);return;}
  try{a.run(r);}catch(e){toast('Action failed: '+e.message,true);}
  save();if(!S.modal)renderApp();
}

function visibleRows(m){
  var rows=rowsOf(m).slice(),q=S.q.trim().toLowerCase();
  if(q)rows=rows.filter(function(r){return m.fields.some(function(f){if(f.type==='password'||f.type==='hidden')return false;var v=r[f.key];if(Array.isArray(v))v=v.map(function(x){return typeof x==='object'?Object.keys(x).map(function(k){return x[k];}).join(' '):x;}).join(' ');return String(v==null?'':v).toLowerCase().indexOf(q)>-1;});});
  if(S.flt){var sf=statusField(m);if(sf)rows=rows.filter(function(r){return r[sf.key]===S.flt;});}
  if(S.sort){var k=S.sort.key,d=S.sort.dir;rows.sort(function(a,b){var x=a[k],y=b[k];if(Array.isArray(x))x=x.length;if(Array.isArray(y))y=y.length;var nx=Number(x),ny=Number(y);var c=(x!==''&&y!==''&&x!=null&&y!=null&&!isNaN(nx)&&!isNaN(ny))?nx-ny:String(x==null?'':x).localeCompare(String(y==null?'':y));return c*d;});}
  return rows;
}

/* seed pending approvals for records that are already "Pending Approval" so the approval workflow can be exercised */
function seedLinks(){
  if(!D('approvals'))return;
  [['purchaseReq','Purchase Request',function(r){return r.estAmount;},function(r){return 'PR '+r.pr+': '+r.material;},function(r){return r.project;}],
   ['purchaseOrders','Purchase Order',function(r){return r.amount;},function(r){return 'PO '+r.po+' - '+r.supplier;},function(r){return r.project;}],
   ['expenses','Expense',function(r){return r.amount;},function(r){return 'Expense: '+r.title;},function(r){return r.project;}]].forEach(function(x){
    D(x[0]).filter(function(r){return r.status==='Pending Approval'&&!D('approvals').some(function(a){return a.srcId===r._id;});}).forEach(function(r){
      var rule=pickRule(x[1],num(x[2](r)),x[4](r));
      add('approvals',{request:x[3](r),type:x[1],srcMod:x[0],srcId:r._id,project:x[4](r),amount:num(x[2](r)),requestedBy:'Procurement Officer',date:addDays(todayISO(),-2),requiredRole:rule?rule.approverRole:'Project Manager',level:rule?rule.level:'Level 1',status:'Pending',decidedBy:'',decidedOn:'',comments:''},true);
    });
  });
}

function bookingAfter(b){var p=find('properties',b.property);if(!p)return;if(b.status==='Cancelled'){if(/^(Booked|Reserved)$/.test(p.status))p.status='Available';return;}p.status=b.status==='Sold'?'Sold':(b.status==='Reserved'?'Reserved':'Booked');}
function scheduleFor(b){
  var rem=num(b.net)-num(b.bookingAmt)-num(b.downPayment)-num(b.possession);if(rem<0)rem=0;var n=Math.max(1,num(b.count));
  var step={'Monthly':1,'Quarterly':3,'Half-yearly':6,'Annual':12,'Milestone-based':4}[b.freq]||1;
  var rows=[],d=b.date||todayISO();
  if(num(b.bookingAmt))rows.push({label:'Booking amount',due:d,amount:num(b.bookingAmt)});
  if(num(b.downPayment))rows.push({label:'Down payment',due:addDays(d,15),amount:num(b.downPayment)});
  var each=Math.floor(rem/n);
  for(var i=1;i<=n;i++){var amt=(i===n)?rem-each*(n-1):each;rows.push({label:b.freq==='Milestone-based'?'Milestone '+i:'Installment '+i,due:addDays(d,30*step*i+15),amount:amt});}
  if(num(b.possession))rows.push({label:'Possession payment',due:addDays(d,30*step*n+60),amount:num(b.possession)});
  return rows;
}
function genSchedule(b){
  var ex=D('installments').filter(function(i){return i.booking===b.no;});if(ex.length)return 0;
  scheduleFor(b).forEach(function(s,i){add('installments',{booking:b.no,customer:b.customer,no:i+1,label:s.label,due:s.due,amount:s.amount,paid:0,paidOn:'',receipt:'',status:'Pending'});});return 1;
}

/* ---- availability engine (BRD §37) ---- */
function freeResources(svc,start,end,exceptOrder){
  if(!svc)return {names:[],count:0,total:0};
  if(svc.category==='Managed Service'){
    var used=sum(D('serviceOrders').filter(function(o){return o.service===svc.name&&o.no!==exceptOrder&&!/^(Cancelled|Completed|Invoiced)$/.test(o.status)&&overlap(o.start,o.end,start,end);}),'qty');
    var tot=num(svc.capacity);return {names:[],count:Math.max(0,tot-used),total:tot};
  }
  var pool=svc.category==='Equipment'
    ?D('equipment').filter(function(e){return e.type===svc.trade&&e.ownership==='Owned'&&!/^(Under Maintenance|Breakdown|Unavailable)$/.test(e.status);}).map(function(e){return e.name;})
    :D('workers').filter(function(w){return w.trade===svc.trade&&!/^(On Leave|Unavailable)$/.test(w.availability);}).map(function(w){return w.name;});
  var free=pool.filter(function(n){return !D('assignments').some(function(a){return a.resource===n&&overlap(a.from,a.to,start,end);});});
  return {names:free,count:free.length,total:pool.length};
}

/* ===================== HELPERS (cost, progress, scheduling) + OPERATIONAL PAGES ===================== */
function kpi(label,val,sub,cls,go){return '<div class="kpi'+(cls?' '+cls:'')+'"'+(go?' data-a="nav" data-id="'+go+'" style="cursor:pointer"':'')+'><small>'+esc(label)+'</small><b>'+val+'</b>'+(sub?'<span>'+sub+'</span>':'')+'</div>';}
function cardH(title,body,right){return '<div class="card"><div class="ch"><h3>'+esc(title)+'</h3>'+(right||'')+'</div><div class="cb">'+body+'</div></div>';}
function tblH(heads,rows,empty){if(!rows.length)return '<div class="empty small">'+esc(empty||'No data to show.')+'</div>';return '<div class="tw"><table class="tbl"><thead><tr>'+heads.map(function(h){return '<th class="na">'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';}
function barH(p,cls){p=Math.max(0,Math.min(100,Number(p)||0));return '<div class="bar'+(cls?' '+cls:'')+'"><i style="width:'+p+'%"></i></div>';}
function hasSvc(s){return S.user&&S.user.services.indexOf(s)>-1;}

function projActs(name){return D('activities').filter(function(a){return a.project===name;});}
function projProgress(name){
  var a=projActs(name);if(!a.length)return 0;var w=sum(a,'plannedCost');
  if(w>0)return Math.round(a.reduce(function(t,x){return t+num(x.progress)*num(x.plannedCost);},0)/w);
  return Math.round(sum(a,'progress')/a.length);
}
function estimatedCost(name){return D('boq').filter(function(b){return b.project===name;}).reduce(function(t,b){return t+num(b.qty)*num(b.rate);},0);}
function committedCost(name){
  var po=sum(D('purchaseOrders').filter(function(p){return p.project===name&&/^(Approved|Ordered|Partially Received|Received)$/.test(p.status);}),'amount');
  var ct=sum(D('contracts').filter(function(c){return c.project===name&&/^(Active|Completed)$/.test(c.status);}),'amount');
  return po+ct;
}
var COVERED=['Labour','Materials','Contractors','Equipment'];
function costBreakdown(name,actName){
  var okA=function(r){return !actName||r.activity===actName;};
  var labour=sum(D('attendance').filter(function(a){return a.project===name&&okA(a)&&a.approval!=='Rejected';}),'cost');
  var material=0;D('stockMoves').forEach(function(m){if(m.project!==name||!okA(m))return;var mt=find('materials',m.material);var v=num(m.qty)*(mt?num(mt.rate):0);if(m.type==='Material Issue')material+=v;else if(m.type==='Return')material-=v;});
  var contractor=0;D('conInvoices').forEach(function(i){var c=find('contracts',i.contract);if(c&&c.project===name&&okA(c)&&i.status!=='Cancelled')contractor+=num(i.net);});
  var equipment=sum(D('eqLogs').filter(function(l){return l.project===name&&okA(l);}),'cost');
  var other=sum(D('expenses').filter(function(e){return e.project===name&&okA(e)&&/^(Approved|Paid)$/.test(e.status)&&COVERED.indexOf(e.category)<0;}),'amount');
  return {labour:labour,material:Math.max(0,material),contractor:contractor,equipment:equipment,other:other,total:labour+Math.max(0,material)+contractor+equipment+other};
}
function forecastCost(name){
  var p=projProgress(name),act=costBreakdown(name).total,est=estimatedCost(name),com=committedCost(name);
  var f=p>=5?Math.round(act/p*100):est;return Math.max(f,act,Math.min(com,Math.max(est,com)));
}
function lateDays(a){if(a.status==='Completed'||num(a.progress)>=100)return 0;var d=a.pend?diffDays(a.pend,todayISO()):0;return d>0?d:0;}
function lateContract(c){if(!/^Active$/.test(c.status)||num(c.progress)>=100)return 0;var d=c.end?diffDays(c.end,todayISO()):0;return d>0?d:0;}
function workerFree(w,from,to){return !/^(On Leave|Unavailable)$/.test(w.availability)&&!D('assignments').some(function(a){return a.resource===w.name&&overlap(a.from,a.to,from,to);});}
function workforceStat(r){
  var pool=D('workers').filter(function(w){return w.trade===r.trade;});
  var assigned=pool.filter(function(w){return D('assignments').some(function(a){return a.resource===w.name&&a.kind==='Internal Project'&&a.ref===r.project&&overlap(a.from,a.to,r.from,r.to);});}).length;
  var avail=pool.filter(function(w){return workerFree(w,r.from,r.to);}).length;
  var need=Math.max(0,num(r.required)-assigned);
  return {assigned:assigned,available:avail,shortage:Math.max(0,need-avail)};
}
function matStock(name){return stockOf(name);}
function lowStock(){return D('materials').map(function(m){return {m:m,qty:stockOf(m.name)};}).filter(function(x){return x.qty<=num(x.m.minStock);});}

/* ---------- Notifications (BRD section 53) ---------- */
function allAlerts(){
  var a=[];
  if(hasSvc('construction')){D('approvals').filter(function(x){return x.status==='Pending';}).forEach(function(x){a.push(['Approval',x.request+' needs '+x.requiredRole]);});lowStock().forEach(function(x){a.push(['Inventory','Low stock: '+x.m.name]);});D('activities').filter(function(x){return lateDays(x)>0;}).forEach(function(x){a.push(['Schedule','Delayed: '+x.name+' ('+lateDays(x)+' d)']);});}
  if(hasSvc('propertySales'))D('installments').filter(function(x){return x.status==='Overdue';}).forEach(function(x){a.push(['Payments','Installment overdue: '+x.customer+' - '+x.label]);});
  if(hasSvc('propertyRental')){D('leases').filter(function(x){return x.status==='Expiring';}).forEach(function(x){a.push(['Lease','Expiring: '+x.no+' ('+x.tenant+')']);});D('maintenance').filter(function(x){return x.priority==='Critical'&&x.stage!=='Closed';}).forEach(function(x){a.push(['Maintenance','Critical: '+x.title]);});}
  if(hasSvc('resourceServices'))D('customerInvoices').filter(function(x){return x.status==='Overdue';}).forEach(function(x){a.push(['Receivable','Overdue invoice '+x.no+' ('+x.customer+')']);});
  return a;
}

function findLogin(e,p){
  var a=DB.accounts.filter(function(x){return x.email.toLowerCase()===e&&x.password===p;})[0];
  if(a)return {acct:a};
  for(var i=0;i<DB.accounts.length;i++){
    var ac=DB.accounts[i];ensureTenant(ac);useTenant(ac.email);
    var u=D('users').filter(function(x){return String(x.email).toLowerCase()===e&&x.password===p;})[0];
    if(u)return {acct:ac,user:u};
  }
  return null;
}
function doLogin(fd){
  var e=String(fd.get('email')||'').trim().toLowerCase(),p=String(fd.get('password')||'');
  var hit=findLogin(e,p);
  if(!hit)return authMsg('Email or password is incorrect.');
  var a=hit.acct;
  if(a.status==='Suspended')return authMsg('This company account is suspended. Contact the super admin.');
  ensureTenant(a);
  if(hit.user){
    if(hit.user.status==='Inactive')return authMsg('This user is inactive. Contact your administrator.');
    enter(a,{_id:hit.user._id,name:hit.user.name,email:hit.user.email,company:a.company,services:a.services,tk:a.email.toLowerCase(),isSuper:false,role:hit.user.role,linked:hit.user.linked||'',acct:a,phone:hit.user.phone});
  }else enter(a);
}

  if(!o.company||!o.name||!o.email||!o.password)return authMsg('Please fill all required fields (*).');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email))return authMsg('Enter a valid email address.');
  if(o.password.length<6)return authMsg('Password must be at least 6 characters.');

  var a={_id:uid(),company:o.company,name:o.name,email:o.email,phone:o.phone,password:o.password,services:S.signSel.slice(),role:'admin',status:'Active',slug:slugOf(o.company)};

  var nal=hasSvc('construction')||hasSvc('propertySales')||hasSvc('propertyRental')||hasSvc('resourceServices')?allAlerts().length:0;
  $('#app').innerHTML='<div class="shell"><aside class="side'+(S.nav?' open':'')+'"><div class="brand"><img src="'+LOGO+'" alt="Hunarsaaz Construction"></div><nav>'+nav+'</nav><div class="foot"><div class="av">'+esc(initials(u.name))+'</div><div class="who"><b>'+esc(u.name)+'</b><small>'+esc(u.company)+'</small></div><button class="icon-btn" title="Sign out" data-a="logout">'+ic('logout')+'</button></div></aside>'+
   '<div class="scrim'+(S.nav?' show':'')+'" data-a="navclose"></div><div class="main"><div class="top"><button class="icon-btn burger" data-a="navopen">'+ic('menu')+'</button><h3>'+esc(cur?cur.label:'')+'</h3><span class="pill co">'+esc(u.company)+'</span><span class="pill role">'+esc(u.role)+'</span>'+(allowedView('notifications')?'<button class="icon-btn bellb" title="Notifications" data-a="nav" data-id="notifications">'+ic('bell')+(nal?'<em>'+nal+'</em>':'')+'</button>':'')+'</div><div class="page" id="page"></div></div></div>';
  renderPage();
}
function renderPage(){
  var it=S.view==='dashboard'?null:itemById(S.view),h;
  try{h=S.view==='dashboard'?dashboardHTML():(it.kind==='page'?it.render():moduleHTML(it));}catch(e){h='<div class="card"><div class="cb"><div class="err">This page could not be displayed: '+esc(e.message)+'</div></div></div>';}
  var p=$('#page');if(p)p.innerHTML=h;
}
function setView(id){S.view=id;S.q='';S.flt='';S.sort=null;S.nav=false;closeModal();renderApp();try{window.scrollTo(0,0);}catch(e){}}

/* ---------- module page ---------- */
function statsHTML(m){
  var all=rowsOf(m),sf=statusField(m),st='<div class="stat"><small>Total records</small><b>'+all.length+'</b></div>';
  if(sf)sf.opts.slice(0,4).forEach(function(o){st+='<div class="stat"><small>'+esc(o)+'</small><b>'+all.filter(function(r){return r[sf.key]===o;}).length+'</b></div>';});
  return st;
}
function moduleHTML(m){
  var sf=statusField(m);
  var fl=sf?'<select class="inp" style="width:auto" data-in="flt"><option value="">All statuses</option>'+sf.opts.map(function(o){return '<option'+(S.flt===o?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>':'';
  return '<div class="mhead"><div><h2>'+esc(m.label)+'</h2><p>Create, view, edit and delete '+esc(m.noun.toLowerCase())+' records'+(m.actions?' and run workflow actions':'')+'.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="csv">'+ic('dl')+'Export CSV</button><button class="btn pri" data-a="add">'+ic('plus')+'Add '+esc(m.noun.toLowerCase())+'</button></div></div><div class="stats" id="stats">'+statsHTML(m)+'</div>'+
   '<div class="card"><div class="tools"><div class="search">'+ic('search')+'<input class="inp" data-in="q" placeholder="Search…" value="'+esc(S.q)+'"></div>'+fl+'</div><div class="tw" id="tbl">'+tableHTML(m)+'</div></div>';
}
function tableHTML(m){
  var rows=visibleRows(m),cols=colsOf(m),calc=m.calc||[];
  var th=cols.map(function(f){var a=S.sort&&S.sort.key===f.key?(S.sort.dir>0?' ▲':' ▼'):'';return '<th data-a="sort" data-k="'+f.key+'">'+esc(f.label)+a+'</th>';}).join('')+calc.map(function(c){return '<th class="na">'+esc(c[0])+'</th>';}).join('')+'<th class="na" style="text-align:right">Actions</th>';
  var body=rows.map(function(r){
    var acts=applicableActions(m,r);var first=acts[0];
    return '<tr>'+cols.map(function(f){return '<td>'+cell(m,f,r)+'</td>';}).join('')+calc.map(function(c){return '<td>'+c[1](r)+'</td>';}).join('')+'<td class="act">'+(first?'<button class="btn sm wf" title="'+esc(first.label)+'" data-a="act" data-act="'+first.id+'" data-id="'+r._id+'">'+esc(first.label.length>22?first.label.slice(0,21)+'…':first.label)+'</button>':'')+'<button class="icon-btn" title="View / actions" data-a="view" data-id="'+r._id+'">'+ic('eye')+'</button><button class="icon-btn" title="Edit" data-a="edit" data-id="'+r._id+'">'+ic('edit')+'</button><button class="icon-btn del" title="Delete" data-a="del" data-id="'+r._id+'">'+ic('trash')+'</button></td></tr>';
  }).join('');
  var total=rowsOf(m).length;
  return '<table><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table>'+(rows.length?'':'<div class="empty">'+(total?'No records match your search.':'No records yet. Click "Add" to create one.')+'</div>')+'<div class="foot-note">Showing '+rows.length+' of '+total+' record'+(total===1?'':'s')+'</div>';
}
function refreshTable(){var m=BYID[S.view];if(!m||m.kind!=='crud')return;var t=$('#tbl');if(t)t.innerHTML=tableHTML(m);var s=$('#stats');if(s)s.innerHTML=statsHTML(m);}
function exportCSV(){var m=BYID[S.view],rows=visibleRows(m),fs=m.fields.filter(function(f){return f.type!=='password'&&f.type!=='hidden';});openCSV(m.label,fs.map(function(f){return f.label;}),rows.map(function(r){return fs.map(function(f){var v=r[f.key];if(Array.isArray(v))v=v.map(function(x){return typeof x==='object'?(x.name||Object.keys(x).map(function(k){return x[k];}).join(' ')):x;}).join('; ');return v;});}));}

/* ---------- mobile + portal actions ---------- */
function nowHM(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes());}
function mobileAction(a){
  var me=S.user.linked||S.user.name,t=todayISO(),w=find('workers',me),proj=(w&&w.project)||fieldProject();
  if(a==='mcheck'){
    if(!w){toast('Your user is not linked to a worker record. Set "Linked record" to the worker name.',true);return;}
    var rec=D('attendance').filter(function(x){return x.worker===me&&x.date===t;})[0];
    if(rec&&rec.outT){toast('You have already checked out today.',true);return;}
    if(rec){rec.outT=nowHM();if(timeMin(rec.outT)<=timeMin(rec.inT))rec.outT=p2(Math.min(23,Math.floor(timeMin(rec.inT)/60)+8))+':00';BYID.attendance.compute(rec);toast('Checked out - '+rec.hours+' hours (GPS captured)');}
    else{var r=add('attendance',{worker:me,date:t,project:proj,mode:'GPS',shift:'General',inT:nowHM(),outT:'',brk:0,status:'Present',leaveType:'None',approval:'Pending'});toast('Checked in at '+r.inT+' (GPS captured)');}
    return;
  }
  var cfg={
   mreport:{title:'Daily site report',fields:[F({key:'project',label:'Project',type:'ref',opts:'projects'}),F('work|Work performed!|textarea'),F('workers|Labour on site|number'),F('progress|Progress %|number')],values:{project:proj,workers:0,progress:0},ok:function(v){if(num(v.progress)>100)return 'Progress cannot exceed 100%.';add('dailyReports',{project:v.project,date:t,weather:'Sunny',by:S.user.name,workers:num(v.workers),work:v.work,progress:num(v.progress),status:'Submitted'});toast('Daily report submitted');}},
   mmat:{title:'Material request',fields:[F({key:'project',label:'Project',type:'ref',opts:'projects'}),F({key:'material',label:'Material',type:'ref',opts:'materials',req:true}),F('qty|Quantity!|number')],values:{project:proj},ok:function(v){if(!v.material)return 'Select a material.';if(num(v.qty)<=0)return 'Enter a quantity.';var r=add('materialReq',{req:nextNo('materialReq','req','MR-'),project:v.project,material:v.material,qty:num(v.qty),needBy:addDays(t,3),requestedBy:S.user.name,status:'Open'});toast('Material request '+r.req+' created');}},
   msafety:{title:'Report safety issue',fields:[F('title|What happened!|text'),F({key:'type',label:'Type',type:'select',opts:['Incident','Near Miss','Safety Inspection','PPE Check']}),F({key:'severity',label:'Severity',type:'select',opts:['Low','Medium','High','Critical']}),F({key:'project',label:'Project',type:'ref',opts:'projects'})],values:{project:proj},ok:function(v){add('safety',{title:v.title,type:v.type,project:v.project,date:t,severity:v.severity,by:S.user.name,status:'Open'});toast('Safety report logged');}},
   mmaint:{title:'Maintenance request',fields:[F('title|Problem!|text'),F({key:'property',label:'Property',type:'ref',opts:'properties'}),F({key:'category',label:'Category',type:'select',opts:MCATS.split(',')}),F({key:'priority',label:'Priority',type:'select',opts:['Low','Medium','High','Critical']})],values:{},ok:function(v){add('maintenance',{title:v.title,category:v.category,property:v.property,by:S.user.name,priority:v.priority,stage:'Requested',date:t});toast('Maintenance request raised');}},
   mts:{title:'Log service timesheet',fields:[F({key:'order',label:'Service order',type:'ref',opts:'serviceOrders',req:true}),F('inT|Check in!|time'),F('outT|Check out!|time')],values:{inT:'08:00',outT:'17:00'},ok:function(v){if(!v.order)return 'Select an order.';var o=find('serviceOrders',v.order)||{};var r=add('extAttendance',{order:v.order,resource:me,date:t,inT:v.inT,outT:v.outT,lat:num(o.siteLat)?num(o.siteLat)+0.0004:'',lng:num(o.siteLng)?num(o.siteLng)+0.0004:'',supApproval:'Pending',custApproval:'Pending'});toast('Timesheet logged - '+r.hours+' h, '+r.gps);}}
  }[a];
  if(!cfg)return;
  openPrompt({title:cfg.title,fields:cfg.fields,values:cfg.values,okLabel:'Submit',onOk:cfg.ok});
}
function portalAction(a,t){
  var me=myName(),tday=todayISO();
  if(a==='portalmaint'){var ls=D('leases').filter(function(l){return l.tenant===me;}),pr=ls.length?ls[0].property:'';openPrompt({title:'New maintenance request',fields:[F('title|Problem!|text'),F({key:'category',label:'Category',type:'select',opts:MCATS.split(',')}),F({key:'priority',label:'Priority',type:'select',opts:['Low','Medium','High','Critical']})],values:{},okLabel:'Submit',onOk:function(v){add('maintenance',{title:v.title,category:v.category,property:pr,by:me,priority:v.priority,stage:'Requested',date:tday});toast('Request submitted');}});}
  else if(a==='portalreq'){openPrompt({title:'New resource request',fields:[F({key:'service',label:'Service',type:'ref',opts:'serviceCatalogue',req:true}),F('qty|Quantity!|number'),F('start|Start date!|date'),F('end|End date!|date'),F('location|Site location|text')],values:{start:addDays(tday,7),end:addDays(tday,14),qty:1},okLabel:'Submit request',onOk:function(v){if(!v.service)return 'Select a service.';if(num(v.qty)<=0)return 'Enter a quantity.';if(v.end<v.start)return 'End date cannot be before the start date.';var r=add('resourceRequests',{no:nextNo('resourceRequests','no','RR-'),customer:me,service:v.service,qty:num(v.qty),start:v.start,end:v.end,location:v.location,priority:'Normal',status:'New',availability:''});notify('New resource request '+r.no+' from '+me);toast('Request '+r.no+' submitted');}});}
  else if(a==='portalquote'){var q=D('quotations').filter(function(x){return x._id===t.getAttribute('data-id');})[0];if(q){q.status=t.getAttribute('data-v')==='acc'?'Accepted':'Rejected';toast('Quotation '+q.status.toLowerCase());}}
  else if(a==='portalts'){var ts=D('extAttendance').filter(function(x){return x._id===t.getAttribute('data-id');})[0];if(ts){ts.custApproval='Approved';toast('Timesheet approved');}}
}

/* ---------- events ---------- */
function bindApp(){
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');
  if(!t){if(S.msOpen&&!e.target.closest('.ms')){S.msOpen=false;var ms=$('#ms');if(ms)ms.innerHTML=msHTML();}return;}
  var a=t.getAttribute('data-a');
  if(a==='mback'){if(e.target===t)closeModal();return;}
  if(a==='ms-pick')return;
  if(S.msOpen&&a!=='ms-toggle'&&!e.target.closest('.ms')){S.msOpen=false;var ms2=$('#ms');if(ms2)ms2.innerHTML=msHTML();}
  if(S.user)useTenant(S.user.tk);
  var id=t.getAttribute('data-id'),m=BYID[S.view];
  switch(a){
    case 'mode':S.mode=t.getAttribute('data-m');S.msOpen=false;S.pwShow=false;renderAuth();break;
    case 'pw':{S.pwShow=!S.pwShow;var inp=t.closest('form').querySelector('[name=password]');inp.type=S.pwShow?'text':'password';t.innerHTML=ic(S.pwShow?'eyeoff':'eye');break;}
    case 'demo':{var f2=$('form[data-form=login]');f2.querySelector('[name=email]').value=t.getAttribute('data-e');f2.querySelector('[name=password]').value=t.getAttribute('data-p');authMsg('Credentials filled - click Sign in.',true);break;}
    case 'ms-toggle':S.msOpen=!S.msOpen;$('#ms').innerHTML=msHTML();break;
    case 'nav':setView(id);break;
    case 'logout':AIHIST.length=0;S.user=null;S.mode='login';S.nav=false;closeModal();renderAuth();break;
    case 'navopen':S.nav=true;renderApp();break;
    case 'navclose':S.nav=false;renderApp();break;
    case 'reset':S.modal={type:'reset'};drawModal();break;
    case 'resetok':try{window.localStorage.removeItem(KEY);}catch(x){}DB={accounts:seedAccounts(),data:{}};S.user=null;S.mode='login';closeModal();renderAuth();toast('Demo data reset. Please sign in again.');break;
    case 'sort':{var k=t.getAttribute('data-k');S.sort=(S.sort&&S.sort.key===k)?(S.sort.dir===1?{key:k,dir:-1}:null):{key:k,dir:1};refreshTable();break;}
    case 'add':S.modal={type:'form',mod:S.view,id:null};drawModal();break;
    case 'edit':S.modal={type:'form',mod:S.view,id:id};drawModal();break;
    case 'view':S.modal={type:'view',mod:S.view,id:id};drawModal();break;
    case 'del':S.modal={type:'del',mod:S.view,id:id};drawModal();break;
    case 'delok':deleteRecord(id);break;
    case 'act':runAction(S.view,t.getAttribute('data-act'),id);break;
    case 'mclose':closeModal();break;
    case 'csv':exportCSV();break;
    case 'copycsv':{var ta=$('#csvtxt');var done=function(){toast('CSV copied');};ta.focus();ta.select();var okc=false;try{okc=document.execCommand('copy');}catch(x){}if(okc)done();else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,function(){toast('Press Ctrl+C to copy the selected text.');});}else toast('Press Ctrl+C to copy the selected text.');break;}
    case 'addline':{var box=t.parentNode.querySelector('[data-lines="'+t.getAttribute('data-k')+'"]');var mm=m&&m.fields.filter(function(f){return f.key===t.getAttribute('data-k');})[0];if(box&&mm){var d=document.createElement('div');d.innerHTML=lineRowHTML(mm,null);box.appendChild(d.firstChild);}break;}
    case 'rmline':{var row=t.closest('.lrow');if(row)row.remove();break;}
    case 'tab':S.tab[t.getAttribute('data-k')]=t.getAttribute('data-v');renderPage();break;
    case 'quick':{if(BYID[id]){S.view=id;S.q='';S.flt='';S.sort=null;renderApp();S.modal={type:'form',mod:id,id:null};drawModal();}break;}
    case 'mkpr':{var mt=find('materials',id);if(mt){var pr=add('purchaseReq',{pr:nextNo('purchaseReq','pr','PR-'),project:fieldProject(),material:mt.name,qty:num(mt.reorder),estAmount:num(mt.reorder)*num(mt.rate),requestedBy:S.user.name,date:todayISO(),status:'Draft'});save();toast('Purchase request '+pr.pr+' created for '+mt.name);renderPage();}break;}
    case 'runrep':runReport(id,false);break;
    case 'csvrep':runReport(id,true);break;
    case 'clearbox':SET().outbox=[];save();renderPage();break;
    case 'aiq':{AIHIST.push({who:'me',t:t.getAttribute('data-q')});AIHIST.push(aiMsg(t.getAttribute('data-q')));renderPage();var c=$('#chat');if(c)c.scrollTop=c.scrollHeight;break;}
    case 'permreset':SET().rolePerms={};save();renderPage();toast('Permissions reset to defaults');break;
    case 'mcheck':case 'mreport':case 'mmat':case 'msafety':case 'mmaint':case 'mts':mobileAction(a);save();if(!S.modal)renderPage();break;
    case 'portalmaint':case 'portalreq':case 'portalquote':case 'portalts':portalAction(a,t);save();if(!S.modal)renderPage();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target,a=t.getAttribute&&t.getAttribute('data-a');
  if(a==='ms-pick'){var v=t.value,i=S.signSel.indexOf(v);if(t.checked&&i<0)S.signSel.push(v);if(!t.checked&&i>-1)S.signSel.splice(i,1);$('#ms').innerHTML=msHTML();return;}
  if(S.user)useTenant(S.user.tk);
  if(t.getAttribute&&t.getAttribute('data-in')==='flt'){S.flt=t.value;refreshTable();}
  else if(a==='tabsel'){S.tab[t.getAttribute('data-k')]=t.value;renderPage();}
  else if(a==='chan'){SET().notify[t.getAttribute('data-k')]=t.checked;save();toast('Notification settings saved');}
  else if(a==='perm'){var r=t.getAttribute('data-r'),g=t.getAttribute('data-t'),st=SET();var cur=(st.rolePerms[r]||DEFROLE[r]||['core']).slice();var i2=cur.indexOf(g);if(t.checked&&i2<0)cur.push(g);if(!t.checked&&i2>-1)cur.splice(i2,1);if(cur.indexOf('core')<0)cur.push('core');st.rolePerms[r]=cur;save();toast(r+': access updated');}
});
document.addEventListener('input',function(e){var t=e.target;if(t.getAttribute&&t.getAttribute('data-in')==='q'){S.q=t.value;refreshTable();}});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var k=f.getAttribute('data-form');if(S.user)useTenant(S.user.tk);
  if(k==='login')doLogin(new FormData(f));
  else if(k==='signup')doSignup(new FormData(f));
  else if(k==='rec')saveRecord(f);
  else if(k==='prompt'){
    var cfg=PROMPT,rd=readFields(f,cfg.fields,null,true);var err=rd.err;
    if(!err){try{err=cfg.onOk(rd.obj);}catch(x){err='Failed: '+x.message;}}
    if(typeof err==='string'&&err){var el=$('#form-err');if(el)el.innerHTML='<div class="err" style="margin-bottom:12px">'+esc(err)+'</div>';return;}
    if(PROMPT===cfg)closeModal();
    save();renderApp();
  }
  else if(k==='ai'){var q=String(new FormData(f).get('q')||'').trim();if(!q)return;AIHIST.push({who:'me',t:q});AIHIST.push(aiMsg(q));renderPage();var c2=$('#chat');if(c2)c2.scrollTop=c2.scrollHeight;}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal)closeModal();});
}
bindApp();
window.__HSC={DB:function(){return DB;},S:S,MODS:MODS,PAGES:PAGES,BYID:BYID,PBYID:PBYID,login:function(e,p){var fd=new FormData();fd.set('email',e);fd.set('password',p);doLogin(fd);}};
renderApp();

})();
</script>
</body>
</html>
